name: Gerar ROM 32X

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MARS_INSTALL_DIR: /home/runner/mars
      MARSDEV: /home/runner/mars
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: sudo apt-get update && sudo apt-get install -y build-essential texinfo wget libpng-dev ffmpeg

      - name: Obter o Marsdev
        id: mars
        run: |
          git clone --recurse-submodules https://github.com/andwn/marsdev /tmp/marsdev
          echo "sha=$(git -C /tmp/marsdev rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache da toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /home/runner/mars
          key: marsdev-${{ steps.mars.outputs.sha }}-m68k-sh-v1

      - name: Compilar a toolchain (só na primeira vez, pode demorar mais de 1 hora)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp/marsdev
          make m68k-toolchain-newlib -j4
          make sh-toolchain-newlib -j4
          make install

      - name: Preparar o projeto a partir do esqueleto 32X
        run: |
          SK=$(find /tmp/marsdev/examples -maxdepth 1 -type d -iname '*32x*' | head -1)
          if [ -z "$SK" ]; then echo "Esqueleto 32X não encontrado no Marsdev"; ls /tmp/marsdev/examples; exit 1; fi
          echo "Esqueleto: $SK"
          cp -r "$SK" build
          # O arranque do exemplo deixa o SH-2 secundário à espera de um sinal que o main.c original dá.
          # Lê esse sinal do main.c original (antes de o substituirmos) e passa-o ao jogo em sincronia.h.
          echo "--- sinal de arranque do SH-2 secundário no exemplo ---"
          grep -rn "MASTER_STATUS_OK\|SLAVE_STATUS\|COMM6" "$SK" || true
          DEF=$(grep -rhE "^[[:space:]]*#define[[:space:]]+MASTER_STATUS_OK[[:space:]]" "$SK" | head -1)
          STMT=$(grep -hoE "MARS_SYS_COMM[0-9]+[[:space:]]*=[[:space:]]*MASTER_STATUS_OK" "$SK"/src/*.c | head -1)
          {
            echo "/* Gerado pelo workflow a partir do exemplo do Marsdev. */"
            echo "#ifndef SINCRONIA_H"
            echo "#define SINCRONIA_H"
            if [ -n "$DEF" ]; then echo "#ifndef MASTER_STATUS_OK"; echo "$DEF"; echo "#endif"; fi
            if [ -n "$STMT" ]; then echo "#define LIBERTAR_SLAVE() do { $STMT; } while (0)"; fi
            echo "#endif"
          } > src/sincronia.h
          echo "--- sincronia.h gerado ---"; cat src/sincronia.h
          echo "--- leitura do comando no exemplo (SH-2 e 68000) ---"
          grep -n -B2 -A20 "HwMdReadPad" "$SK"/src/hw_32x.c || true
          grep -rn "COMM8\|COMM10\|A15128\|A1512A\|0xA10003\|0xA10005\|pad" "$SK"/src_md "$SK"/*.s 2>/dev/null | head -60 || true
          # gera a arte e o fundo no PC (dados da ROM) e copia o código do jogo
          gcc -O2 -std=gnu99 -o gerar tools/gerar_assets.c -lm
          ./gerar > src/assets.h
          # converte as músicas (IMA ADPCM, 11025 Hz: fortaleza e título, aldeia, intro) e os efeitos (16 bits, mesma taxa)
          # a música da fase 1 é cortada em 90 s (com fade no fim do ciclo) para poupar espaço na ROM
          ffmpeg -hide_banner -loglevel error -y -i musica/Arcade_Rush.mp3 -t 90 -af "afade=t=in:st=0:d=0.3,afade=t=out:st=87:d=3" -ac 1 -ar 11025 -f s16le fortaleza.raw
          ffmpeg -hide_banner -loglevel error -y -i musica/aldeia.mp3 -ac 1 -ar 11025 -f s16le aldeia.raw
          ffmpeg -hide_banner -loglevel error -y -i musica/intro.mp3 -ac 1 -ar 11025 -f s16le intro.raw
          # pântano: ciclo perfeito de 32 compassos (128 batidas a 147 bpm), com 60 ms de transição na ligação
          ffmpeg -hide_banner -loglevel error -y -i musica/pantano.mp3 -ac 1 -ar 11025 -f s16le pantano_inteira.raw
          python3 tools/fazer_loop.py pantano_inteira.raw pantano.raw 11025 1.62503 53.8414 60
          python3 tools/converter_musica.py 11025 FORTALEZA fortaleza.raw ALDEIA aldeia.raw INTRO intro.raw PANTANO pantano.raw > src/musica.h
          for n in hurt powerup attack teleport monster trovao fogo ossos porta impacto confirmar; do
            ffmpeg -hide_banner -loglevel error -y -i sons/$n.wav -ac 1 -ar 11025 -f s16le $n.raw
          done
          python3 tools/converter_sfx.py 11025 HURT hurt.raw POWERUP powerup.raw ATTACK attack.raw TELEPORT teleport.raw MONSTER monster.raw TROVAO trovao.raw FOGO fogo.raw OSSOS ossos.raw PORTA porta.raw IMPACTO impacto.raw CONFIRMAR confirmar.raw > src/sfx.h
          # o nosso slave.c substitui o do exemplo: o SH-2 secundário toca a música
          cp src/main.c src/slave.c src/sincronia.h src/mundo.h src/assets.h src/logo.h src/musica.h src/sfx.h build/src/
          # corrige o arranque do 68000 do exemplo para o comando funcionar no hardware real e no MiSTer
          python3 tools/corrigir_crt1.py --so-interrupcoes build/m68k_crt0.s
          python3 tools/corrigir_crt1.py build/m68k_crt1.s

      - name: Compilar a ROM
        run: |
          cd build
          make MARSDEV=$MARSDEV
          ls -la
          # o 32X só vê 4 MB de cartucho
          for f in *.32x; do s=$(stat -c %s "$f"); echo "$f: $s bytes"; if [ "$s" -gt 4194304 ]; then echo "A ROM passa dos 4 MB do 32X"; exit 1; fi; done
          cp "$(ls *.32x | head -1)" ../cinzas-da-eternidade.32x

      - name: Guardar a ROM
        uses: actions/upload-artifact@v4
        with:
          name: cinzas-da-eternidade-32x
          path: cinzas-da-eternidade.32x

      - name: Guardar o código do 68000 corrigido (diagnóstico)
        uses: actions/upload-artifact@v4
        with:
          name: codigo-68000
          path: |
            build/m68k_crt0.s
            build/m68k_crt1.s
          if-no-files-found: error
